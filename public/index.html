<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Transcribe App" />
  <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Transcribe App</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app" data-view="list">

  <section id="listView" class="view view-list is-active">
    <header class="list-header">
      <div class="title-row">
        <button id="sidebarBtn" class="icon-btn" type="button" aria-label="Ordner anzeigen" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <h1 id="listTitle" class="large-title">Notizen</h1>
        <button id="folderMenuBtn" class="icon-btn" type="button" aria-label="Mehr" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div id="folderMenu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-action="settings">Einstellungen</button>
          <button type="button" role="menuitem" data-action="rename" data-folder-only>Ordner umbenennen</button>
          <button type="button" role="menuitem" data-action="delete" data-folder-only class="menu-danger">Ordner löschen</button>
        </div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Suchen" autocomplete="off" enterkeyhint="search" />
      </label>
    </header>
    <div id="notesList" class="notes-list"></div>
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
      </div>
      <p class="empty-title">Noch keine Notizen</p>
      <p class="empty-text">Tippe auf den Aufnahmeknopf und sprich einfach los.</p>
    </div>
  </section>

  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
  <aside id="sidebar" class="sidebar" aria-label="Ordner" aria-hidden="true" inert>
    <h2 class="sidebar-title">Ordner</h2>
    <nav id="folderList" class="folder-list"></nav>
    <button id="newFolderBtn" class="sidebar-new" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Neuer Ordner</span>
    </button>
    <div class="backup">
      <p id="backupStatus" class="backup-status"></p>
      <button id="backupBtn" class="backup-btn" type="button"></button>
      <button id="diagBtn" class="diag-btn" type="button">Aufnahme-Protokoll kopieren</button>
    </div>
  </aside>

  <section id="editorView" class="view view-editor" aria-hidden="true" inert>
    <header class="editor-header">
      <button id="backBtn" class="nav-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span id="backLabel">Notizen</span>
      </button>
      <div class="editor-actions">
        <button id="summaryBtn" class="icon-btn" type="button" aria-label="Zusammenfassen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        </button>
        <button id="copyBtn" class="icon-btn" type="button" aria-label="Kopieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button id="shareBtn" class="icon-btn" type="button" aria-label="Teilen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>
        </button>
        <button id="deleteBtn" class="icon-btn icon-btn-danger" type="button" aria-label="Löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>
    <div class="editor-meta">
      <span id="editorDate"></span>
      <label class="folder-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="folderPillText">Kein Ordner</span>
        <svg class="folder-pill-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <select id="noteFolder" aria-label="Ordner"></select>
      </label>
    </div>
    <div id="noteBanner" class="note-banner" hidden>
      <span id="noteBannerText" class="note-banner-text"></span>
      <button id="noteBannerBtn" class="note-banner-btn" type="button">Erneut senden</button>
    </div>
    <div id="speakerBar" class="speaker-bar" hidden></div>
    <textarea id="editorText" class="editor-text" placeholder="Text eingeben oder diktieren …" spellcheck="true"></textarea>
    <div class="dictate-bar">
      <canvas id="dictateWave" class="wave" aria-hidden="true"></canvas>
      <button id="dictateBtn" class="dictate-btn" type="button" aria-label="Diktieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
      </button>
    </div>
  </section>

  <div id="recordDock" class="record-dock">
    <button id="recordBtn" class="record-btn" type="button" aria-label="Aufnahme starten"><span class="record-core"></span></button>
    <button id="meetingBtn" class="meeting-btn" type="button" aria-label="Meeting aufnehmen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>
      <span>Meeting</span>
    </button>
  </div>

  <section id="recordSheet" class="record-sheet" aria-hidden="true" inert>
    <div class="sheet-top">
      <span class="rec-indicator"></span>
      <span id="recordTimer" class="rec-timer">0:00</span>
      <span id="recordMode" class="rec-mode" hidden>Meeting</span>
    </div>
    <div id="liveText" class="live-text" data-placeholder="Sprich einfach los …"></div>
    <div class="sheet-bottom">
      <p id="recordStatus" class="rec-status"></p>
      <canvas id="recordWave" class="wave wave-lg" aria-hidden="true"></canvas>
      <button id="stopBtn" class="stop-btn" type="button" aria-label="Aufnahme beenden"><span class="stop-core"></span></button>
    </div>
  </section>

  <section id="settingsSheet" class="settings-sheet" aria-label="Einstellungen" aria-hidden="true" inert>
    <header class="settings-header">
      <h2 class="settings-title">Einstellungen</h2>
      <button id="settingsDone" class="settings-done" type="button">Fertig</button>
    </header>
    <div class="settings-body">
      <h3 class="settings-group">Transkription</h3>
      <div class="settings-card">
        <label class="settings-row">
          <span class="settings-label">Groq Whisper<small>Standard, schnell</small></span>
          <input type="radio" name="provider" value="groq" />
        </label>
        <label class="settings-row">
          <span class="settings-label">Microsoft MAI<small>Genauer, ca. 10 Cent pro Stunde</small></span>
          <input type="radio" name="provider" value="mai" />
        </label>
        <label class="settings-row">
          <span class="settings-label">Ersatz-Anbieter<small>Fällt einer aus, springt der andere ein</small></span>
          <input id="fallbackToggle" type="checkbox" class="switch" />
        </label>
      </div>
      <p class="settings-note">Meetings laufen immer über Microsoft MAI, weil nur das die Sprecher erkennt.</p>

      <h3 class="settings-group">Zusammenfassung</h3>
      <div class="settings-card">
        <div class="settings-row settings-row-static">
          <span class="settings-label">Modell<small id="summaryModelName"></small></span>
        </div>
        <label class="model-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="modelSearch" type="search" placeholder="Modell suchen (OpenRouter)" autocomplete="off" />
        </label>
        <div id="modelList" class="model-list"></div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastText" class="toast-text"></span>
    <button id="toastAction" class="toast-action" type="button" hidden></button>
  </div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
