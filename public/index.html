<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Whisperflow" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Whisperflow</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="tabs">
        <button class="tab active" data-tab="transcribe">Transcribe</button>
        <button class="tab" data-tab="notes">Notes</button>
      </div>
      <div class="actions">
        <button id="copyAllBtn" class="icon-btn" title="Alles kopieren" aria-label="Alles kopieren">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <button id="clearBtn" class="icon-btn" title="Verlauf löschen" aria-label="Verlauf löschen">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="screen">
      <!-- Transcribe Tab -->
      <section id="transcribeView" class="view active">
        <div id="status" class="status" aria-live="polite"></div>
        <div id="transcript" class="transcript"></div>
      </section>

      <!-- Notes Tab -->
      <section id="notesView" class="view">
        <div id="notesList" class="notes-list"></div>
      </section>
    </main>

    <footer class="bottombar">
      <canvas id="waveCanvas" class="wave-canvas" aria-hidden="true"></canvas>
      <button id="recordBtn" class="record-btn" aria-label="Aufnahme starten">
        <span class="record-dot"></span>
      </button>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
